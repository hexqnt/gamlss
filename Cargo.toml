[workspace]
members = [
    "gamlss-bayes",
    "gamlss-core",
    "gamlss-datasets",
    "gamlss-diagnostics",
    "gamlss-family",
    "gamlss-spline",
    "gamlss-formula",
    "gamlss-special",
    "gamlss-transform",
]
resolver = "3"

[workspace.package]
version = "0.3.1"
edition = "2024"
description = "Type-driven Rust crates for GAMLSS modeling"
license = "MIT OR Apache-2.0"
authors = ["hexqnt <hexqntlab@gmail.com>"]
repository = "https://github.com/hexqnt/gamlss"
documentation = "https://docs.rs/gamlss"
readme = "README.md"
keywords = ["gamlss", "statistics", "regression", "distributional"]
categories = ["algorithms", "mathematics", "science"]

[workspace.dependencies]
approx = "0.5.1"
criterion = { version = "0.8.2", default-features = false, features = [
    "cargo_bench_support",
] }
gamlss-core = { path = "gamlss-core", version = "0.3.1" }
gamlss-bayes = { path = "gamlss-bayes", version = "0.3.1" }
gamlss-datasets = { path = "gamlss-datasets" }
gamlss-diagnostics = { path = "gamlss-diagnostics", version = "0.3.1" }
gamlss-family = { path = "gamlss-family", version = "0.3.1" }
gamlss-formula = { path = "gamlss-formula", version = "0.3.1" }
gamlss-spline = { path = "gamlss-spline", version = "0.3.1" }
gamlss-special = { path = "gamlss-special", version = "0.3.1" }
gamlss-transform = { path = "gamlss-transform", version = "0.3.1" }
rand = "0.10.2"
rand_distr = "0.6.0"
thiserror = "2.0.18"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
cargo = "warn"
too_many_lines = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
many_single_char_names = { level = "allow", priority = 1 }
used_underscore_binding = { level = "allow", priority = 1 }

[package]
name = "gamlss"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
include = [
    "src/**/*",
    "doc-assets/*",
    "docs/**/*",
    "examples/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE*",
]

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "doc-assets/katex-header.html"]

[features]
default = ["formula"]
bayes = ["dep:gamlss-bayes"]
formula = ["dep:gamlss-formula"]
multivariate = ["gamlss-family/multivariate"]
rand = ["gamlss-family/rand"]

[dependencies]
gamlss-bayes = { workspace = true, optional = true }
gamlss-core.workspace = true
gamlss-diagnostics.workspace = true
gamlss-family.workspace = true
gamlss-formula = { workspace = true, optional = true }
gamlss-spline.workspace = true
gamlss-special.workspace = true
gamlss-transform.workspace = true

[dev-dependencies]
approx.workspace = true
argmin = "0.11.0"
argmin-math = { version = "0.5.1", features = ["vec"] }
gamlss-datasets = { path = "gamlss-datasets", features = ["rand"] }
rand.workspace = true

[[example]]
name = "simple_multivariate_fit"
required-features = ["multivariate", "rand"]

[[example]]
name = "faithful_mixture_fit"
required-features = ["multivariate"]

[lints]
workspace = true
