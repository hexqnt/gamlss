[package]
name = "gamlss-spline"
version.workspace = true
edition.workspace = true
description = "Spline bases, penalties, and metadata for GAMLSS modeling"
license.workspace = true
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/gamlss-spline"
readme = "README.md"
keywords.workspace = true
categories.workspace = true
include = [
    "src/**/*",
    "doc-assets/*",
    "benches/**/*",
    "Cargo.toml",
    "README.md",
]

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "doc-assets/katex-header.html"]

[dependencies]
gamlss-core.workspace = true
thiserror.workspace = true

[dev-dependencies]
approx.workspace = true
criterion.workspace = true

[[bench]]
name = "spline_hot_paths"
harness = false

[lints]
workspace = true
