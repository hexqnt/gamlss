include = [
    "src/**/*",
    "doc-assets/*",
    "Cargo.toml",
    "README.md",
]

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "doc-assets/katex-header.html"]

[dependencies]
gamlss-special.workspace = true
