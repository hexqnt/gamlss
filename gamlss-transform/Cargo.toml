[package]
name = "gamlss-transform"
version.workspace = true
edition.workspace = true
description = "Target transforms for GAMLSS modeling"
license.workspace = true
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/gamlss-transform"
readme = "README.md"
keywords.workspace = true
