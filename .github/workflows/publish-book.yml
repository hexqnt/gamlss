name: Publish book

on:
  push:
    branches: [master]
    paths:
      - "book/**"
      - "book_build_and_push.sh"
      - ".github/workflows/publish-book.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-book-yandex
  cancel-in-progress: false

jobs:
  publish:
    name: Publish book to Yandex Object Storage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install mdBook tools
        run: |
          set -euo pipefail
          cargo install mdbook --version 0.5.3 --locked
          cargo install mdbook-katex --version 0.10.0-alpha --locked

      - name: Install Yandex Cloud CLI
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP}/yandex-cloud"
          curl --fail --silent --show-error --location \
            https://storage.yandexcloud.net/yandexcloud-yc/install.sh \
            | bash -s -- -i "$install_dir" -n
          echo "${install_dir}/bin" >> "$GITHUB_PATH"
          "${install_dir}/bin/yc" version

      - name: Configure Yandex Cloud CLI
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail

          if [[ -z "${YC_SERVICE_ACCOUNT_KEY_JSON:-}" ]]; then
            echo "Error: YC_SERVICE_ACCOUNT_KEY_JSON secret is not configured." >&2
            exit 1
          fi

          key_path="${RUNNER_TEMP}/yc-service-account-key.json"
          umask 077
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$key_path"
          yc config profile create book-publisher
          yc config set service-account-key "$key_path"

      - name: Build and publish book
        env:
          S3_BUCKET: gamlss.hexq.ru
          GZIP_MIN_BYTES: "10240"
        run: ./book_build_and_push.sh

      - name: Remove service account key
        if: always()
        run: rm -f "${RUNNER_TEMP}/yc-service-account-key.json"
